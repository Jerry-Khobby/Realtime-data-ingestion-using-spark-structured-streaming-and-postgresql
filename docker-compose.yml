services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres_setup.sql:/docker-entrypoint-initdb.d/postgres_setup.sql
    networks:
      - spark_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/raw:/data/raw
      - ./data/checkpoints:/data/checkpoints
      - ./logs:/logs
      - ./etl:/opt/spark-apps/etl # Mount for live code updates
    ports:
      - "4050:4050" # Spark UI
    networks:
      - spark_network
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  spark_network:
    driver: bridge
